<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1350" viewBox="0 0 1640 1350" role="img" aria-label="Forum · Sequence Diagram"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.3"/></marker><marker id="triangle" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L13 6 L0 12Z" fill="white" stroke="#64748b"/></marker><marker id="zeroone" markerWidth="18" markerHeight="16" refX="18" refY="8" orient="auto-start-reverse"><circle cx="5" cy="8" r="3" fill="white" stroke="#64748b"/><path d="M12 1V15" stroke="#64748b"/></marker><marker id="one" markerWidth="14" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M6 1V15 M10 1V15" fill="none" stroke="#64748b"/></marker><marker id="many" markerWidth="20" markerHeight="18" refX="20" refY="9" orient="auto"><circle cx="4" cy="9" r="3" fill="white" stroke="#64748b"/><path d="M9 9L20 1 M9 9L20 9 M9 9L20 17" stroke="#64748b" fill="none"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Segoe UI, Arial, sans-serif"><text x="35" y="47" font-size="29" font-weight="700" fill="#155e75">Forum · Sequence Diagram</text><text x="35" y="79" font-size="16" fill="#475569">Tạo bài viết: POST /api/v1/posts · authenticated user</text><g><polyline points="165,192 165,1070" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5"  /></g><g><polyline points="485,192 485,1070" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5"  /></g><g><polyline points="805,192 805,1070" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5"  /></g><g><polyline points="1125,192 1125,1070" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5"  /></g><g><polyline points="1445,192 1445,1070" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5"  /></g><g><polyline points="165,250 485,250" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)" /><text x="325" y="238" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">1. POST /api/v1/posts + Bearer JWT</text></g><g><polyline points="485,416 805,416" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)" /><text x="645" y="404" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">2. CreatePostAsync(request, authorId, name, avatar)</text></g><g><polyline points="805,558 1125,558" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)" /><text x="965" y="546" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">3. AddAsync(Post + Images + Tags)</text></g><g><polyline points="1125,624 1445,624" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)" /><text x="1285" y="612" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">4. DbContext.Posts.AddAsync + SaveChangesAsync</text></g><g><polyline points="1445,690 1125,690" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#arrow)" /><text x="1285" y="678" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">5. Lưu aggregate + khóa ngoại nội bộ</text></g><g><polyline points="1125,756 805,756" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#arrow)" /><text x="965" y="744" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">6. Post đã lưu</text></g><g><polyline points="805,922 485,922" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#arrow)" /><text x="645" y="910" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">7. PostResponse</text></g><g><polyline points="485,1088 165,1088" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#arrow)" /><text x="325" y="1076" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">8. 201 Created + Location + PostResponse</text></g><g><rect x="20" y="135" width="290" height="57" rx="4" fill="white" stroke="#cbd5e1"/><path d="M24 135H306Q310 135 310 139V175H20V139Q20 135 24 135" fill="#155e75"/><text x="36" y="162" font-size="19" font-weight="650" fill="white">User / Web</text></g><g><rect x="340" y="135" width="290" height="57" rx="4" fill="white" stroke="#cbd5e1"/><path d="M344 135H626Q630 135 630 139V175H340V139Q340 135 344 135" fill="#155e75"/><text x="356" y="162" font-size="19" font-weight="650" fill="white">PostsController</text></g><g><rect x="660" y="135" width="290" height="57" rx="4" fill="white" stroke="#cbd5e1"/><path d="M664 135H946Q950 135 950 139V175H660V139Q660 135 664 135" fill="#155e75"/><text x="676" y="162" font-size="19" font-weight="650" fill="white">PostService</text></g><g><rect x="980" y="135" width="290" height="57" rx="4" fill="white" stroke="#cbd5e1"/><path d="M984 135H1266Q1270 135 1270 139V175H980V139Q980 135 984 135" fill="#155e75"/><text x="996" y="162" font-size="19" font-weight="650" fill="white">PostRepository</text></g><g><rect x="1300" y="135" width="290" height="57" rx="4" fill="white" stroke="#cbd5e1"/><path d="M1304 135H1586Q1590 135 1590 139V175H1300V139Q1300 135 1304 135" fill="#155e75"/><text x="1316" y="162" font-size="19" font-weight="650" fill="white">Forum SQL Server</text></g><g><rect x="50" y="302" width="1540" height="70" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="64" y="330" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">ASP.NET Core: validate JWT + request model. Invalid token → 401; invalid body → 400.</text><text x="64" y="354" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">Controller lấy userId, fullName, avatarUrl từ claims.</text></g><g><rect x="50" y="468" width="1540" height="46" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="64" y="496" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">PostService: trim title/content; tạo PostImages theo thứ tự; chuẩn hóa PostTags.</text></g><g><rect x="50" y="808" width="1540" height="70" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="64" y="836" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">PostService gọi IKafkaProducerService.PublishPostCreatedAsync qua _ = (không await).</text><text x="64" y="860" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">Topic post.created.v1; key PostId; lỗi publish được log. Không bảo đảm delivery bằng outbox.</text></g><g><rect x="50" y="974" width="1540" height="70" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="64" y="1002" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">PostsController await SignalR: Clients.All.SendAsync(&quot;ReceiveNewPost&quot;, created).</text><text x="64" y="1026" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">Tác vụ Kafka có thể vẫn đang chạy khi HTTP response được trả về.</text></g><text x="35" y="1330" font-size="14" fill="#64748b">FPT Alumni Connect · Source snapshot: 11 Nov 2026 · 01 Sequence</text></g></svg>