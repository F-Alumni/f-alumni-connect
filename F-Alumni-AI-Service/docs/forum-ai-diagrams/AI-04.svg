="#0f172a">   Content: nvarchar(max)</text><text x="944" y="324" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   Keywords: nvarchar(max)</text></g><g><rect x="40" y="650" width="630" height="177" rx="4" fill="white" stroke="#cbd5e1"/><path d="M44 650H666Q670 650 670 654V690H40V654Q40 650 44 650" fill="#4338ca"/><text x="56" y="677" font-size="19" font-weight="650" fill="white">AiConversations</text><text x="54" y="714" font-size="16" font-family="Consolas, monospace" fill="#0f172a">PK Id: uniqueidentifier</text><text x="54" y="738" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   UserId: uniqueidentifier</text><text x="54" y="762" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   Title: nvarchar(250)</text><text x="54" y="786" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   CreatedAt: datetime2</text><text x="54" y="810" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   LastMessageAt: datetime2</text></g><g><rect x="930" y="650" width="680" height="201" rx="4" fill="white" stroke="#cbd5e1"/><path d="M934 650H1606Q1610 650 1610 654V690H930V654Q930 650 934 650" fill="#4338ca"/><text x="946" y="677" font-size="19" font-weight="650" fill="white">AiMessages</text><text x="944" y="714" font-size="16" font-family="Consolas, monospace" fill="#0f172a">PK Id: uniqueidentifier</text><text x="944" y="738" font-size="16" font-family="Consolas, monospace" fill="#0f172a">FK ConversationId: uniqueidentifier</text><text x="944" y="762" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   Role: nvarchar(20)</text><text x="944" y="786" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   Content: nvarchar(max)</text><text x="944" y="810" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   CitationsJson: nvarchar(max)</text><text x="944" y="834" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   CreatedAt: datetime2</text></g><g><rect x="40" y="1140" width="630" height="297" rx="4" fill="white" stroke="#cbd5e1"/><path d="M44 1140H666Q670 1140 670 1144V1180H40V1144Q40 1140 44 1140" fill="#4338ca"/><text x="56" y="1167" font-size="19" font-weight="650" fill="white">MentorProfiles</text><text x="54" y="1204" font-size="16" font-family="Consolas, monospace" fill="#0f172a">PK Id: uniqueidentifier</text><text x="54" y="1228" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   UserId: uniqueidentifier</text><text x="54" y="1252" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   FullName: nvarchar(200)</text><text x="54" y="1276" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   Email: nvarchar(200)</text><text x="54" y="1300" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   Major: nvarchar(50)</text><text x="54" y="1324" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   CurrentCompany: nvarchar(max)</text><text x="54" y="1348" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   JobTitle: nvarchar(max)</text><text x="54" y="1372" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   Skills: nvarchar(max)</text><text x="54" y="1396" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   Bio: nvarchar(max)</text><text x="54" y="1420" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   AvatarUrl: nvarchar(max)</text></g><g><rect x="930" y="1140" width="680" height="177" rx="4" fill="white" stroke="#cbd5e1"/><path d="M934 1140H1606Q1610 1140 1610 1144V1180H930V1144Q930 1140 934 1140" fill="#4338ca"/><text x="946" y="1167" font-size="19" font-weight="650" fill="white">SampleItems</text><text x="944" y="1204" font-size="16" font-family="Consolas, monospace" fill="#0f172a">PK Id: uniqueidentifier</text><text x="944" y="1228" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   Name: nvarchar(100)</text><text x="944" y="1252" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   Description: nvarchar(500)</text><text x="944" y="1276" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   IsActive: bit</text><text x="944" y="1300" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   CreatedAtUtc: datetime2</text></g><g><rect x="40" y="1630" width="1570" height="94" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="54" y="1658" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">UserId trong AiConversations và MentorProfiles là tham chiếu logic tới User Service; không có cross-database FK.</text><text x="54" y="1682" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">CitationsJson chứa JSON, không có FK từ AiMessages tới RagChunks. SampleItems là bảng template độc lập.</text><text x="54" y="1706" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">Quan hệ 1 → 0..*: RagDocuments / RagChunks và AiConversations / AiMessages; delete Cascade.</text></g><text x="35" y="1770" font-size="14" fill="#64748b">FPT Alumni Connect · Source snapshot: 11 Nov 2026 · 04 ERD</text></g></svg>