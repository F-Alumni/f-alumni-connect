<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1760" viewBox="0 0 1640 1760" role="img" aria-label="AI · Sequence Diagram"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.3"/></marker><marker id="triangle" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L13 6 L0 12Z" fill="white" stroke="#64748b"/></marker><marker id="zeroone" markerWidth="18" markerHeight="16" refX="18" refY="8" orient="auto-start-reverse"><circle cx="5" cy="8" r="3" fill="white" stroke="#64748b"/><path d="M12 1V15" stroke="#64748b"/></marker><marker id="one" markerWidth="14" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M6 1V15 M10 1V15" fill="none" stroke="#64748b"/></marker><marker id="many" markerWidth="20" markerHeight="18" refX="20" refY="9" orient="auto"><circle cx="4" cy="9" r="3" fill="white" stroke="#64748b"/><path d="M9 9L20 1 M9 9L20 9 M9 9L20 17" stroke="#64748b" fill="none"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Segoe UI, Arial, sans-serif"><text x="35" y="47" font-size="29" font-weight="700" fill="#4338ca">AI · Sequence Diagram</text><text x="35" y="79" font-size="16" fill="#475569">Hỏi đáp RAG: POST /api/v1/ai/chat · JWT hoặc Guest</text><g><polyline points="165,192 165,1480" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5"  /></g><g><polyline points="485,192 485,1480" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5"  /></g><g><polyline points="805,192 805,1480" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5"  /></g><g><polyline points="1125,192 1125,1480" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5"  /></g><g><polyline points="1445,192 1445,1480" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5"  /></g><g><polyline points="165,350 485,350" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)" /><text x="325" y="338" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">1. AskAsync(request, userId)</text></g><g><polyline points="485,416 1125,416" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)" /><text x="805" y="404" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">2. GetConversationAsync(id, userId) nếu có id</text></g><g><polyline points="1125,482 485,482" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#arrow)" /><text x="805" y="470" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">3. Conversation + lịch sử, hoặc null</text></g><g><polyline points="485,548 1125,548" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)" /><text x="805" y="536" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">4. CreateConversationAsync nếu không tìm thấy</text></g><g><polyline points="485,614 805,614" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)" /><text x="645" y="602" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">5. SearchRelevantChunksAsync(question, major, campus, 4)</text></g><g><polyline points="805,680 1125,680" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)" /><text x="965" y="668" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">6. GetAllChunksAsync(programCode, campus)</text></g><g><polyline points="1125,746 805,746" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#arrow)" /><text x="965" y="734" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">7. Chunks + RagDocument</text></g><g><polyline points="805,812 485,812" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#arrow)" /><text x="645" y="800" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">8. Chấm điểm từ khóa + intent; Score &gt; 5; Top 4</text></g><g><polyline points="485,954 1445,954" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)" /><text x="965" y="942" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">9. [key + chunks] POST generateContent + context</text></g><g><polyline points="1445,1020 485,1020" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#arrow)" /><text x="965" y="1008" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">10. [success] generated answer</text></g><g><polyline points="485,1186 1125,1186" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)" /><text x="805" y="1174" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">11. AddMessageAsync(user) → SaveChanges</text></g><g><polyline points="485,1252 1125,1252" fill="none" stroke="#64748b" stroke-width="1.7"  marker-end="url(#arrow)" /><text x="805" y="1240" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">12. AddMessageAsync(assistant + CitationsJson) → SaveChanges</text></g><g><polyline points="485,1418 165,1418" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#arrow)" /><text x="325" y="1406" text-anchor="middle" font-size="15" fill="#0f172a" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">13. AiChatResponse: conversationId, answer, citations → HTTP 200</text></g><g><rect x="20" y="135" width="290" height="57" rx="4" fill="white" stroke="#cbd5e1"/><path d="M24 135H306Q310 135 310 139V175H20V139Q20 135 24 135" fill="#4338ca"/><text x="36" y="162" font-size="19" font-weight="650" fill="white">AiChatController</text></g><g><rect x="340" y="135" width="290" height="57" rx="4" fill="white" stroke="#cbd5e1"/><path d="M344 135H626Q630 135 630 139V175H340V139Q340 135 344 135" fill="#4338ca"/><text x="356" y="162" font-size="19" font-weight="650" fill="white">AiChatService</text></g><g><rect x="660" y="135" width="290" height="57" rx="4" fill="white" stroke="#cbd5e1"/><path d="M664 135H946Q950 135 950 139V175H660V139Q660 135 664 135" fill="#4338ca"/><text x="676" y="162" font-size="19" font-weight="650" fill="white">RagSearchService</text></g><g><rect x="980" y="135" width="290" height="57" rx="4" fill="white" stroke="#cbd5e1"/><path d="M984 135H1266Q1270 135 1270 139V175H980V139Q980 135 984 135" fill="#4338ca"/><text x="996" y="162" font-size="19" font-weight="650" fill="white">RagRepository</text></g><g><rect x="1300" y="135" width="290" height="57" rx="4" fill="white" stroke="#cbd5e1"/><path d="M1304 135H1586Q1590 135 1590 139V175H1300V139Q1300 135 1304 135" fill="#4338ca"/><text x="1316" y="162" font-size="19" font-weight="650" fill="white">Google Gemini</text></g><g><rect x="50" y="236" width="1540" height="70" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="64" y="264" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">Entry: controller lấy userId từ JWT; nếu chưa đăng nhập dùng Guest GUID chung.</text><text x="64" y="288" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">RagRepository đọc/ghi SQL Server qua AiServiceDbContext; DB được gộp vào lane repository.</text></g><g><rect x="50" y="864" width="1540" height="46" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="64" y="892" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">AiChatService tạo citations từ nguồn. Nhánh Gemini chỉ chạy khi có API key và có chunks.</text></g><g><rect x="50" y="1072" width="1540" height="70" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="64" y="1100" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">Fallback: thiếu key, không có chunks, API lỗi hoặc câu trả lời rỗng → tổng hợp local.</text><text x="64" y="1124" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">Không có chunks → thông báo chưa có tài liệu liên quan. History hiện chưa được chèn vào prompt.</text></g><g><rect x="50" y="1304" width="1540" height="70" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="64" y="1332" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">Mỗi AddMessageAsync cập nhật LastMessageAt và tự SaveChangesAsync riêng.</text><text x="64" y="1356" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">Tin nhắn được lưu sau khi sinh câu trả lời; đây không phải một transaction chung cho cả 2 tin.</text></g><text x="35" y="1740" font-size="14" fill="#64748b">FPT Alumni Connect · Source snapshot: 11 Nov 2026 · 01 Sequence</text></g></svg>