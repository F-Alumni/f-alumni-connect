hite">RagRepository</text><text x="1394" y="644" font-size="16" font-family="Consolas, monospace" fill="#0f172a">+ GetAllChunksAsync()</text><text x="1394" y="668" font-size="16" font-family="Consolas, monospace" fill="#0f172a">+ AddMessageAsync()</text><text x="1394" y="692" font-size="16" font-family="Consolas, monospace" fill="#0f172a">+ GetMentorsAsync()</text></g><g><rect x="30" y="1030" width="350" height="81" rx="4" fill="white" stroke="#cbd5e1"/><path d="M34 1030H376Q380 1030 380 1034V1070H30V1034Q30 1030 34 1030" fill="#4338ca"/><text x="46" y="1057" font-size="19" font-weight="650" fill="white">MentorsController</text><text x="44" y="1094" font-size="16" font-family="Consolas, monospace" fill="#0f172a">+ Recommend()</text></g><g><rect x="480" y="1030" width="400" height="81" rx="4" fill="white" stroke="#cbd5e1"/><path d="M484 1030H876Q880 1030 880 1034V1070H480V1034Q480 1030 484 1030" fill="#4338ca"/><text x="496" y="1057" font-size="19" font-weight="650" fill="white">MentorRecommendationService</text><text x="494" y="1094" font-size="16" font-family="Consolas, monospace" fill="#0f172a">+ RecommendMentorsAsync()</text></g><g><rect x="480" y="1200" width="400" height="81" rx="4" fill="white" stroke="#cbd5e1"/><path d="M484 1200H876Q880 1200 880 1204V1240H480V1204Q480 1200 484 1200" fill="#4338ca"/><text x="496" y="1227" font-size="19" font-weight="650" fill="white">IMentorRecommendationService</text><text x="494" y="1264" font-size="16" font-family="Consolas, monospace" fill="#0f172a">&lt;&lt;interface&gt;&gt;</text></g><g><rect x="1380" y="1050" width="350" height="153" rx="4" fill="white" stroke="#cbd5e1"/><path d="M1384 1050H1726Q1730 1050 1730 1054V1090H1380V1054Q1380 1050 1384 1050" fill="#4338ca"/><text x="1396" y="1077" font-size="19" font-weight="650" fill="white">AiServiceDbContext</text><text x="1394" y="1114" font-size="16" font-family="Consolas, monospace" fill="#0f172a">DbSet&lt;RagDocument&gt; / RagChunk</text><text x="1394" y="1138" font-size="16" font-family="Consolas, monospace" fill="#0f172a">DbSet&lt;AiConversation&gt; / AiMessage</text><text x="1394" y="1162" font-size="16" font-family="Consolas, monospace" fill="#0f172a">DbSet&lt;MentorProfile&gt;</text><text x="1394" y="1186" font-size="16" font-family="Consolas, monospace" fill="#0f172a">+ SaveChangesAsync()</text></g><g><rect x="30" y="1440" width="1730" height="118" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="44" y="1468" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">Additional dependencies: AiChatController → IRagIngestionService. AiChatService → IRagRepository + IHttpClientFactory.</text><text x="44" y="1492" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">RagSearchService / MentorRecommendationService → IRagRepository. RagStartupWorker resolves scoped services.</text><text x="44" y="1516" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">Gemini là HTTP API, không phải entity. RAG hiện tìm kiếm lexical + intent scoring, không có vector DB / embedding.</text><text x="44" y="1540" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">IngestForumPostAsync đã có; Program.cs hiện không đăng ký Kafka consumer, nên chưa vẽ như một luồng đang chạy.</text></g><text x="35" y="1620" font-size="14" fill="#64748b">FPT Alumni Connect · Source snapshot: 11 Nov 2026 · 02 Class - Application</text></g></svg>