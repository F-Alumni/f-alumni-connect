" y="1782" font-size="16" font-family="Consolas, monospace" fill="#0f172a">+ Description: string</text><text x="1254" y="1806" font-size="16" font-family="Consolas, monospace" fill="#0f172a">+ IsActive: bool</text><text x="1254" y="1830" font-size="16" font-family="Consolas, monospace" fill="#0f172a">+ CreatedAtUtc: DateTime</text></g><g><rect x="30" y="2100" width="1730" height="118" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="44" y="2128" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">Delete Cascade cho tất cả FK, ngoại trừ Comments.ParentCommentId: Restrict.</text><text x="44" y="2152" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">Không có FK Posts → Categories. Report.TargetId + TargetType là tham chiếu logic; không có FK tới Post/Comment.</text><text x="44" y="2176" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">AuthorId / UserId / ReporterId / CreatorId là GUID ngoài service, không tạo FK sang User DB.</text><text x="44" y="2200" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">UNIQUE: Categories.Slug; Reactions(PostId, UserId); Bookmarks(PostId, UserId); EventAttendees(EventId, UserId).</text></g><text x="35" y="2260" font-size="14" fill="#64748b">FPT Alumni Connect · Source snapshot: 11 Nov 2026 · 03 Class - Domain</text></g></svg>