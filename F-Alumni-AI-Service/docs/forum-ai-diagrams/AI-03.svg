"/><text x="946" y="1167" font-size="19" font-weight="650" fill="white">SampleItem</text><text x="944" y="1204" font-size="16" font-family="Consolas, monospace" fill="#0f172a">+ Id: Guid</text><text x="944" y="1228" font-size="16" font-family="Consolas, monospace" fill="#0f172a">+ Name: string</text><text x="944" y="1252" font-size="16" font-family="Consolas, monospace" fill="#0f172a">+ Description: string</text><text x="944" y="1276" font-size="16" font-family="Consolas, monospace" fill="#0f172a">+ IsActive: bool</text><text x="944" y="1300" font-size="16" font-family="Consolas, monospace" fill="#0f172a">+ CreatedAtUtc: DateTime</text></g><g><rect x="40" y="1630" width="1570" height="94" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="54" y="1658" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">UserId trong AiConversations và MentorProfiles là tham chiếu logic tới User Service; không có cross-database FK.</text><text x="54" y="1682" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">CitationsJson chứa JSON, không có FK từ AiMessages tới RagChunks. SampleItems là bảng template độc lập.</text><text x="54" y="1706" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">Quan hệ 1 → 0..*: RagDocuments / RagChunks và AiConversations / AiMessages; delete Cascade.</text></g><text x="35" y="1770" font-size="14" fill="#64748b">FPT Alumni Connect · Source snapshot: 11 Nov 2026 · 03 Class - Domain</text></g></svg>