"white">SampleItems</text><text x="1254" y="1734" font-size="16" font-family="Consolas, monospace" fill="#0f172a">PK Id: uniqueidentifier</text><text x="1254" y="1758" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   Name: nvarchar(100)</text><text x="1254" y="1782" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   Description: nvarchar(500)</text><text x="1254" y="1806" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   IsActive: bit</text><text x="1254" y="1830" font-size="16" font-family="Consolas, monospace" fill="#0f172a">   CreatedAtUtc: datetime2</text></g><g><rect x="30" y="2100" width="1730" height="118" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="44" y="2128" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">Delete Cascade cho tất cả FK, ngoại trừ Comments.ParentCommentId: Restrict.</text><text x="44" y="2152" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">Không có FK Posts → Categories. Report.TargetId + TargetType là tham chiếu logic; không có FK tới Post/Comment.</text><text x="44" y="2176" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">AuthorId / UserId / ReporterId / CreatorId là GUID ngoài service, không tạo FK sang User DB.</text><text x="44" y="2200" font-size="16" font-family="Segoe UI, sans-serif" fill="#9a3412">UNIQUE: Categories.Slug; Reactions(PostId, UserId); Bookmarks(PostId, UserId); EventAttendees(EventId, UserId).</text></g><text x="35" y="2260" font-size="14" fill="#64748b">FPT Alumni Connect · Source snapshot: 11 Nov 2026 · 04 ERD</text></g></svg>