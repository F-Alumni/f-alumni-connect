<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="gradGate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gradForum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gradAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="gradKafka" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="gradDb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#f8fafc">FPT ALUMNI CONNECT — BACKEND 2 ARCHITECTURE</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#94a3b8">Forum Service (FO-01..FO-16 + FB Events) &amp; AI Service (AI-01..AI-04 + RAG Engine)</text>

  <!-- 1. Client Layer -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="220" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="160" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#38bdf8">Web &amp; Mobile Clients</text>
    <text x="160" y="170" text-anchor="middle" font-size="12" fill="#94a3b8">React 18 &amp; Flutter (Port 5000)</text>
  </g>

  <!-- 2. API Gateway -->
  <g filter="url(#shadow)">
    <rect x="360" y="110" width="260" height="80" rx="10" fill="url(#gradGate)" stroke="#60a5fa" stroke-width="2" />
    <text x="490" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">YARP API Gateway</text>
    <text x="490" y="170" text-anchor="middle" font-size="12" fill="#dbeafe">Port 5000 • JWT Pass-Through • CORS</text>
  </g>

  <line x1="270" y1="150" x2="360" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 3. Forum Service -->
  <g filter="url(#shadow)">
    <rect x="80" y="270" width="460" height="230" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="80" y="270" width="460" height="40" rx="12" fill="url(#gradForum)" />
    <text x="310" y="296" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Forum Service (:5003) — Vinh (BE2)</text>
    
    <text x="100" y="335" font-size="13" font-weight="bold" fill="#34d399">• Posts &amp; Community Feed (FO-01..FO-05, FO-10, FO-12..16)</text>
    <text x="100" y="360" font-size="13" font-weight="bold" fill="#34d399">• Threaded Comments &amp; Reactions (FO-06..FO-08)</text>
    <text x="100" y="385" font-size="13" font-weight="bold" fill="#34d399">• Bookmarks &amp; Policy Reports (FO-09, FO-11)</text>
    <text x="100" y="410" font-size="13" font-weight="bold" fill="#38bdf8">• Facebook-style Events ("Ăn tết 2027", RSVP, Attendees)</text>
    <text x="100" y="435" font-size="13" font-weight="bold" fill="#f43f5e">• Real-time SignalR Hub (/hubs/forum)</text>
    <text x="100" y="460" font-size="13" font-weight="bold" fill="#f59e0b">• Kafka Producer (post.created.v1)</text>
  </g>

  <!-- 4. AI Service -->
  <g filter="url(#shadow)">
    <rect x="660" y="270" width="480" height="230" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <rect x="660" y="270" width="480" height="40" rx="12" fill="url(#gradAI)" />
    <text x="900" y="296" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">AI Service (:5004) — Vinh (BE2)</text>
    
    <text x="680" y="335" font-size="13" font-weight="bold" fill="#c084fc">• RAG Ingestion Pipeline (Curriculum, Tuition, Rules docx)</text>
    <text x="680" y="360" font-size="13" font-weight="bold" fill="#c084fc">• Hybrid Semantic Search (BM25 + TF-IDF Vector Cosine)</text>
    <text x="680" y="385" font-size="13" font-weight="bold" fill="#c084fc">• Multi-turn Conversation &amp; Citations (AI-01..AI-04)</text>
    <text x="680" y="410" font-size="13" font-weight="bold" fill="#34d399">• Forum Experience Sync &amp; Verification Grounding</text>
    <text x="680" y="435" font-size="13" font-weight="bold" fill="#38bdf8">• Alumni Mentorship Matching Engine</text>
    <text x="680" y="460" font-size="13" font-weight="bold" fill="#fbbf24">• Google Gemini API Client + Local Fallback Synthesizer</text>
  </g>

  <!-- Lines from Gateway -->
  <path d="M 430 190 L 430 230 L 310 230 L 310 270" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" />
  <text x="350" y="222" font-size="11" fill="#93c5fd">/api/v1/posts, /events</text>

  <path d="M 550 190 L 550 230 L 900 230 L 900 270" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" />
  <text x="730" y="222" font-size="11" fill="#93c5fd">/api/v1/ai/chat, /mentors</text>

  <!-- Kafka Broker -->
  <g filter="url(#shadow)">
    <rect x="420" y="540" width="360" height="70" rx="10" fill="url(#gradKafka)" stroke="#fbbf24" stroke-width="2" />
    <text x="600" y="570" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Apache Kafka Broker (:29092)</text>
    <text x="600" y="593" text-anchor="middle" font-size="12" fill="#fef3c7">Topic: post.created.v1 (Partition Key: PostId)</text>
  </g>

  <!-- Connection: Forum to Kafka -->
  <path d="M 400 500 L 400 520 L 500 520 L 500 540" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />
  <text x="410" y="533" font-size="10" fill="#34d399">Publish Event</text>

  <!-- Connection: Kafka to AI -->
  <path d="M 700 540 L 700 520 L 800 520 L 800 500" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowOrange)" />
  <text x="710" y="533" font-size="10" fill="#fbbf24">Consume &amp; Index</text>

  <!-- Databases -->
  <g filter="url(#shadow)">
    <rect x="80" y="650" width="460" height="90" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />
    <text x="310" y="680" text-anchor="middle" font-size="15" font-weight="bold" fill="#22d3ee">Database: FAlumni_Forum_Db</text>
    <text x="310" y="705" text-anchor="middle" font-size="12" fill="#94a3b8">Posts • Comments • Reactions • Bookmarks • Events • Attendees • Reports</text>
    <text x="310" y="725" text-anchor="middle" font-size="11" fill="#e2e8f0">(SQL Server: 14333 — Zero Cross-DB Foreign Keys)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="660" y="650" width="480" height="90" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <text x="900" y="680" text-anchor="middle" font-size="15" font-weight="bold" fill="#c084fc">Database: FAlumni_AI_Db</text>
    <text x="900" y="705" text-anchor="middle" font-size="12" fill="#94a3b8">RagDocuments • RagChunks • AiConversations • AiMessages • MentorProfiles</text>
    <text x="900" y="725" text-anchor="middle" font-size="11" fill="#e2e8f0">(In-Memory / SQL Server Isolated Data Store)</text>
  </g>

  <line x1="310" y1="500" x2="310" y2="650" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="900" y1="500" x2="900" y2="650" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)" />

</svg>

